<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Inicio de Sesión - Portal de Empleo UP</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#e7ebf3] dark:border-b-white/10 px-6 md:px-10 py-3 bg-white dark:bg-background-dark">
<div class="flex items-center gap-4 text-[#0d121b] dark:text-white">
<div class="size-8 text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">school</span>
</div>
<h2 class="text-[#0d121b] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Portal de Empleo UP</h2>
</div>
<nav class="hidden md:flex flex-1 justify-end">
<div class="flex items-center gap-8">
<a class="text-[#0d121b] dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary transition-colors uppercase tracking-wide" href="#">Inicio</a>
<a class="text-[#0d121b] dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary transition-colors uppercase tracking-wide" href="#">Requisitos para Registrarse</a>
<a class="text-[#0d121b] dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary transition-colors uppercase tracking-wide" href="#">Contáctenos</a>
</div>
</nav>
<div class="md:hidden">
<span class="material-symbols-outlined text-[#0d121b] dark:text-white">menu</span>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-4 py-12">
<div class="layout-content-container flex flex-col max-w-[480px] w-full bg-white dark:bg-gray-900 p-8 rounded-xl shadow-sm border border-gray-100 dark:border-white/5">
<div class="flex flex-col items-center mb-6">
<div class="mb-4">
<img alt="Logo Universidad de Panamá" class="h-24 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLmM3rAcrzlFASYAagbLXgdHHbdh2j5nIBKz-C5QnJjZ6WRXSgZhcIQKlBtyTALykFZvmwn6aQ2b0cdq5UMNqbu6x4d-qOazXlcOjHfDopP0qHn96ueSQLNQP5QkNrwHGVOjbWp-2S-KYUJ606dgS9Sr8-k4oA4sD6n-beew5QiDN8-llbtDO2udssIgqXmnU1cITToC2-B2cxgoZCTVuLepEiGpdDVRXWAoUwknEdv68w0w_mGaLlGHoUAniSmuyWpmVoK2K3JI4"/>
</div>
<h1 class="text-[#0d121b] dark:text-white tracking-light text-[28px] font-bold leading-tight text-center">Portal de Empleo UP</h1>
<p class="text-[#4c669a] dark:text-gray-400 text-base font-medium mt-2 text-center">Inicia sesión en tu cuenta para continuar</p>
</div>
<form class="space-y-5">
<div class="flex flex-col gap-2">
<label class="flex flex-col w-full">
<p class="text-[#0d121b] dark:text-gray-200 text-sm font-medium leading-normal pb-2">Correo electrónico</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d121b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#cfd7e7] dark:border-white/10 bg-[#f8f9fc] dark:bg-gray-800 focus:border-primary h-12 placeholder:text-[#4c669a] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal transition-all" placeholder="ejemplo@universidad.edu" required="" type="email"/>
</label>
</div>
<div class="flex flex-col gap-2">
<label class="flex flex-col w-full">
<p class="text-[#0d121b] dark:text-gray-200 text-sm font-medium leading-normal pb-2">Contraseña</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d121b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#cfd7e7] dark:border-white/10 bg-[#f8f9fc] dark:bg-gray-800 focus:border-primary h-12 placeholder:text-[#4c669a] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal transition-all" placeholder="••••••••" required="" type="password"/>
</label>
</div>
<div class="flex justify-end">
<button class="text-primary text-sm font-semibold hover:underline" type="button">¿Olvidaste tu contraseña?</button>
</div>
<button class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors mt-2" type="submit">
                            Entrar
                        </button>
</form>
<div class="relative my-8">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200 dark:border-white/10"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-white dark:bg-gray-900 text-gray-500">¿Eres nuevo?</span>
</div>
</div>
<div class="text-center">
<a class="inline-flex items-center gap-2 text-primary text-sm font-bold hover:gap-3 transition-all" href="#">
                            Registrarse como Empresa
                            <span class="material-symbols-outlined text-sm">arrow_forward</span>
</a>
</div>
</div>
<footer class="mt-auto py-8 text-center text-gray-500 dark:text-gray-400 text-xs">
<p>© 2024 Universidad de Panamá - Todos los derechos reservados</p>
</footer>
</main>
</div>
</div>

</body></html>
